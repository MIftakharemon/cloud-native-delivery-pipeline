name: Delivery Pipeline CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'k8s/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com
  BACKEND_IMAGE: delivery-pipeline-backend
  FRONTEND_IMAGE: delivery-pipeline-frontend

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: app/backend

      - name: Run backend linter
        run: npm run lint
        working-directory: app/backend

      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: app/backend

      - name: Setup frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Run frontend linter
        run: npm run lint
        working-directory: app/frontend

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: app/frontend

      - name: Validate Terraform configuration
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform

  build-and-push:
    name: Build & Push Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_tag }}
      frontend_image: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate semantic version tag
        id: version
        run: |
          GIT_TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "v1.0.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION="${GIT_TAG}-${SHORT_SHA}-${TIMESTAMP}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set metadata for images
        id: meta
        run: |
          BACKEND_TAG="${ECR_REGISTRY}/${BACKEND_IMAGE}:${{ steps.version.outputs.version }}"
          FRONTEND_TAG="${ECR_REGISTRY}/${FRONTEND_IMAGE}:${{ steps.version.outputs.version }}"
          echo "backend_tag=${BACKEND_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${FRONTEND_TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name delivery-pipeline-cluster --region ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Update image tags in manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER_BACKEND|${{ needs.build-and-push.outputs.backend_tag }}|g" k8s/deployment.yaml
          sed -i "s|IMAGE_PLACEHOLDER_FRONTEND|${{ needs.build-and-push.outputs.frontend_tag }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n delivery-pipeline --timeout=300s
          kubectl rollout status deployment/frontend -n delivery-pipeline --timeout=300s
